<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>DRONE SYPHON</title>
<style>
  html,body{margin:0;height:100%;background:#0d1210;color:#c4b48a;font:14px/1.3 ui-monospace,Menlo,Consolas,monospace;overflow:hidden;touch-action:none}
  canvas{display:block;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges}
  #hud{position:fixed;left:12px;top:10px;right:12px;pointer-events:none}
  #hud b{color:#d4e07a}
  #msg{position:fixed;left:12px;bottom:88px;right:12px;color:#d4e07a;min-height:1.2em}
  #pad{position:fixed;left:0;right:0;bottom:0;height:80px;display:flex;gap:8px;padding:8px 10px 16px;box-sizing:border-box}
  #pad button{flex:1;background:#1c2420;color:#c4b48a;border:1px solid #3d4a3a;font:inherit}
  #pad button.on{border-color:#d4e07a;color:#d4e07a}
</style>
</head>
<body>
<canvas id="c" width="480" height="270"></canvas>
<div id="hud">DRONE SYPHON · pack <b id="pack">27</b>% · trailer <b id="tr">8</b> · drone <b id="dr">100</b>%</div>
<div id="msg">Ride east. F launches the quad. Hold E on the panel to drink.</div>
<div id="pad">
  <button id="bL">◀</button>
  <button id="bR">▶</button>
  <button id="bJ">HOP</button>
  <button id="bF">LAUNCH</button>
  <button id="bE">SYPHON</button>
</div>
<script src="game.js"></script>
</body>
</html>
